[package]
name = "zeff-launcher"
description = "The zeff launcher: finds the engine a project pins in the engine store and hands the command over."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[lib]
path = "src/lib.rs"

# Installed as `bin/zeff`; named apart in the workspace, where `zeff` is the engine's own binary.
[[bin]]
name = "zeff-launcher"
path = "src/main.rs"

[dependencies]
zeff-diagnostics.workspace = true
toml = { version = "=1.1.8", default-features = false, features = ["parse", "std"] }
# An archive's checksum, its signature, and the archive itself (release 0.9.0, step 18): each
# pure Rust, recorded with its licence in docs/decisions.md.
sha2 = "=0.11.1"
minisign-verify = "=0.3.0"
tar = { version = "=0.4.46", default-features = false }
ruzstd = "=0.9.1"
rawzip = "=0.5.3"
flate2 = { version = "=1.1.11", default-features = false, features = ["rust_backend"] }
# Fetching the index, the key list and an archive (step 19b): HTTP over rustls with the
# system's own certificates; what is fetched is trusted for its signature, not for its host.
ureq = { version = "=3.5.2", default-features = false, features = ["rustls-no-provider", "platform-verifier"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }

[dev-dependencies]
tempfile = "=3.27.0"
insta = "=1.49.0"
proptest = "=1.12.0"
# Signs the archives of the tests with a key made in the test; never linked into the launcher.
minisign = "=0.10.0"
