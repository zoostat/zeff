[package]
name = "zeff-cli"
description = "The zeff command line."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "zeff"
path = "src/main.rs"

[dependencies]
zeff-engine.workspace = true
zeff-regress.workspace = true
zeff-conformance.workspace = true
zeff-lsp.workspace = true
zeff-diagnostics.workspace = true
zeff-ir.workspace = true
zeff-syntax.workspace = true
zeff-registry.workspace = true
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }
ctrlc = "=3.5.2"

[dev-dependencies]
tempfile = "=3.27.0"
insta = "=1.49.0"
