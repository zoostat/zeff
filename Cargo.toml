[workspace]
resolver = "3"
members = [
    "kernel/zeff-columns",
    "kernel/zeff-numeric",
    "kernel/zeff-kernels",
    "kernel/zeff-registry",
    "kernel/zeff-dates",
    "kernel/zeff-diagnostics",
    "kernel/zeff-hash",
    "packages/tier0/core",
    "packages/tier1/data",
    "packages/tier1/datasets",
    "packages/tier1/dist",
    "packages/tier1/results",
    "packages/tier1/stats",
    "packages/tier2/regress",
    "crates/zeff-syntax",
    "crates/zeff-ir",
    "crates/zeff-engine",
    "crates/zeff-cli",
    "crates/zeff-conformance",
    "tools/xtask",
    "tools/zeff-testkit",
    "tools/zeff-bench",
]
# The fuzz targets are a package of their own, built by `cargo +nightly fuzz` in the nightly job.
exclude = ["fuzz"]

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "Apache-2.0"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[workspace.dependencies]
zeff-columns = { path = "kernel/zeff-columns" }
zeff-numeric = { path = "kernel/zeff-numeric" }
zeff-kernels = { path = "kernel/zeff-kernels" }
zeff-registry = { path = "kernel/zeff-registry" }
zeff-core = { path = "packages/tier0/core" }
zeff-data = { path = "packages/tier1/data" }
zeff-datasets = { path = "packages/tier1/datasets" }
zeff-dist = { path = "packages/tier1/dist" }
zeff-results = { path = "packages/tier1/results" }
zeff-stats = { path = "packages/tier1/stats" }
zeff-regress = { path = "packages/tier2/regress" }
zeff-dates = { path = "kernel/zeff-dates" }
zeff-diagnostics = { path = "kernel/zeff-diagnostics" }
zeff-hash = { path = "kernel/zeff-hash" }
zeff-syntax = { path = "crates/zeff-syntax" }
zeff-ir = { path = "crates/zeff-ir" }
zeff-engine = { path = "crates/zeff-engine" }
zeff-conformance = { path = "crates/zeff-conformance" }
zeff-testkit = { path = "tools/zeff-testkit" }
zeff-bench = { path = "tools/zeff-bench" }

# Determinism (Engine Specification, section 8.3, point 3): Rust never fuses multiply-add or
# reorders floating-point operations unless asked, and nothing here asks. Integer overflow is
# checked in every profile because an Int overflow is an error in the language.
[profile.release]
opt-level = 3
codegen-units = 1
lto = "fat"
overflow-checks = true
debug-assertions = false

[profile.dev]
overflow-checks = true
