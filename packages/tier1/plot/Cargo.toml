[package]
name = "zeff-plot"
description = "Package plot (tier 1): the layered grammar of plots; at this release the plot value, the linear scale, the points mark and the versioned scene."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
zeff-core.workspace = true
zeff-columns.workspace = true
zeff-diagnostics.workspace = true
zeff-hash.workspace = true
zeff-numeric.workspace = true
zeff-registry.workspace = true
# The composed form of a letter and its mark, before a text is set (the crate `data` uses already).
unicode-normalization = "=0.1.26"
# DEFLATE, for the streams of a PDF file and the dots of a PNG file (decisions.md, steps
# 22b1 and 22b2): pure Rust, no part of it written for one processor.
miniz_oxide = { version = "=0.9.1", default-features = false, features = ["with-alloc"] }

[dev-dependencies]
zeff-testkit.workspace = true
zeff-datasets.workspace = true
insta = "=1.49.0"
proptest = "=1.12.0"
serde_json = "=1.0.154"
# An independent reader of the fonts, for the tests of `font` alone (decisions.md, step 21a).
ttf-parser = "=0.25.1"
# An independent reader of XML, for the tests of `svg` alone (decisions.md, step 21c).
roxmltree = "=0.21.2"
# An independent reader of PDF, for the tests of `pdf` alone (decisions.md, step 22b1).
lopdf = { version = "=0.47.0", default-features = false }
# An independent reader of PNG, for the tests of `png` alone (decisions.md, step 22b2).
png = "=0.18.1"
