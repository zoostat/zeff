name: Scheduled

# The nightly and weekly jobs of the testing handbook, sections 2.2, 2.3 and 6: the long property
# runs, the stochastic class, the truth-recovery Monte Carlo, the benchmark suite and the fuzzing
# every night, coverage and mutation testing every week. All can also be
# started by hand from the Actions page. Results go to each run's summary page and its artifacts.
on:
  schedule:
    - cron: "17 2 * * *"   # nightly, 02:17 UTC
    - cron: "41 3 * * 1"   # weekly, Mondays 03:41 UTC
  workflow_dispatch:
    inputs:
      job:
        description: "Which job to run"
        type: choice
        options: [both, nightly, fuzz, weekly, coverage, bench]
        default: both
      shard:
        description: "Run only these mutation shards of the weekly job, each written as `package k/n`, separated by commas without spaces"
        type: string
        default: ""

permissions:
  contents: read

# `shell: bash` named explicitly, so that every step runs with `-o pipefail` and a test that
# fails behind `| tee` fails the step (the default shell of a Linux runner has no pipefail,
# which let the stochastic class for `sample` fail unnoticed on 3 November 2026).
defaults:
  run:
    shell: bash

jobs:
  nightly:
    name: nightly (long property runs)
    if: >-
      github.event_name == 'workflow_dispatch' && (inputs.job == 'both' || inputs.job == 'nightly')
      || github.event.schedule == '17 2 * * *'
    runs-on: ubuntu-latest
    # The long test step alone took 104 minutes on 14 November 2026 (0.7.0, 280 test programs),
    # and the benchmark suite after it was cut off at the old limit of 120.
    timeout-minutes: 180
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - name: Run every test with every property run 25 times longer, in release mode
        env:
          ZEFF_PROPERTY_MULTIPLIER: "25"
        run: cargo test --workspace --locked --release 2>&1 | tee nightly.log

      - name: Run the stochastic class, 50 seeds of 100,000 draws for each distribution
        run: cargo test -p zeff-dist --locked --release --test nightly_stochastic -- --ignored --nocapture 2>&1 | tee stochastic.log

      - name: Run the stochastic class for sample, 50 seeds against the uniform
        run: cargo test -p zeff-data --locked --release --test nightly_stochastic -- --ignored --nocapture 2>&1 | tee -a stochastic.log

      - name: Run the truth-recovery Monte Carlo, 50 seeds under three designs
        run: cargo test -p zeff-regress --locked --release --test nightly_truth -- --ignored --nocapture 2>&1 | tee truth.log

      - name: Run the truth-recovery Monte Carlo of glm and of its margins, 50 seeds under two designs and each link
        run: cargo test -p zeff-glm --locked --release --test nightly_truth -- --ignored --nocapture 2>&1 | tee -a truth.log

      - name: Run the benchmark suite (import, summary, mean and aggregate by group, reg, reg with two-way fixed effects, the column chain; 10⁴, 10⁶ and 10⁷ rows)
        run: cargo bench -p zeff-bench --locked --bench suite 2>&1 | tee bench-suite.log

      # The browser build in the suite (testing handbook, section 6): the same generated file,
      # each case a script run through the engine as a browser loads it, under Node, and
      # checked to the byte against the native engine before its time counts.
      - name: Write the generated files and what the native engine prints for each browser case
        run: cargo run -q --release --locked -p zeff-bench --bin bench_browser -- browser-bench

      - name: Restore the WebAssembly binding tool
        id: tool
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-0.2.129-${{ runner.os }}

      - name: Install the WebAssembly binding tool at the pinned version
        if: steps.tool.outputs.cache-hit != 'true'
        run: cargo install wasm-bindgen-cli --version '=0.2.129' --locked

      - name: Build the engine's worker for WebAssembly
        env:
          RUSTFLAGS: -C target-feature=+simd128 -C link-arg=-zstack-size=8388608
        run: |
          cargo build --release --locked -p zeff-web --target wasm32-unknown-unknown
          wasm-bindgen --target nodejs --out-dir web-pkg target/wasm32-unknown-unknown/release/zeff_web.wasm

      - name: Run the browser cases of the benchmark suite (10⁴ and 10⁶ rows)
        run: node crates/zeff-web/js/bench.mjs web-pkg browser-bench 2>&1 | tee browser-bench.log

      - name: Write the note
        if: always()
        run: |
          {
            echo "## Nightly: long property runs"
            echo
            echo "Every property test ran 25 times its usual number of cases, in release mode."
            echo
            echo '```'
            grep -E "^test result|^test .*FAILED|minimal failing" nightly.log || true
            echo '```'
            echo
            echo "## Nightly: the stochastic class"
            echo
            echo "Each of the 14 distributions was drawn 100,000 times under each of 50 seeds and compared with its exact mean, variance and distribution function (mean within 5 standard errors, no lean over the seeds, Kolmogorov–Smirnov distance below 2.6/sqrt(n))."
            echo
            echo '```'
            cat stochastic.log || true
            echo '```'
            echo
            echo "## Nightly: truth recovery"
            echo
            echo "Fifty seeds of 400 rows were drawn with the engine's generator under three designs with known coefficients (homoskedastic, heteroskedastic and clustered errors) and fitted by \`reg\` with classical, HC1 to HC3 and CR1 errors. Each coefficient's bias is within four standard errors of its Monte Carlo mean, and the 95 per cent intervals of the standard errors that suit each design cover between 89 and 99.5 per cent of the time (testing handbook, section 1). Then fifty seeds of 1,000 binary outcomes were drawn under each link, logit and probit, with independent rows and with rows alike within a hundred clusters, and fitted by \`glm\` with classical, HC1 to HC3 and clustered errors, under the same two bounds. On the same seeds the 95 per cent intervals of the average effects on the probability (\`margins\`) cover the true average effect of the rows drawn, under the same bound."
            echo
            echo '```'
            grep -vE "^(running|test |$)" truth.log || true
            echo '```'
            echo
            echo "## Nightly: the benchmark suite"
            echo
            echo "Processor: $(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2- | sed 's/^ //')"
            echo
            echo "The suite of the testing handbook, section 6: \`import\` of a CSV, \`summary\` and \`mean\` by a group, and \`reg\` without fixed effects, at ten thousand, a million and ten million rows of generated data, each result checked against its stored digest before it is timed. The times are recorded in the release notes; a slow-down is a note to act on, not a failure of the job (open decision #52)."
            echo
            echo '```'
            grep -B1 "time:" bench-suite.log | grep -v "^--$" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-log
          path: |
            nightly.log
            stochastic.log
            truth.log
            bench-suite.log
            browser-bench.log
            browser-bench/browser-bench.json
          if-no-files-found: ignore

  bench:
    # The micro-benchmark of open decision #47 on the x86-64 runner: the reduction shape of
    # zeff-kernels against the scalar sum of zeff-numeric. Started by hand only; its figures go to
    # the run's summary page and are recorded in docs/decisions.md.
    name: benchmark (the reduction shape, x86-64)
    if: github.event_name == 'workflow_dispatch' && inputs.job == 'bench'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - name: Run the micro-benchmark of the reductions
        run: cargo bench -p zeff-kernels --locked --bench reduction 2>&1 | tee bench.log

      - name: Write the note
        if: always()
        run: |
          {
            echo "## Benchmark: the reduction shape of open decision #47"
            echo
            echo "Processor: $(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2- | sed 's/^ //')"
            echo
            echo '```'
            grep -B1 "time:" bench.log | grep -v "^--$" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-log
          path: bench.log
          if-no-files-found: ignore

  fuzz:
    name: nightly (fuzzing)
    if: >-
      github.event_name == 'workflow_dispatch' && (inputs.job == 'both' || inputs.job == 'fuzz')
      || github.event.schedule == '17 2 * * *'
    runs-on: ubuntu-latest
    # Eight targets of ten minutes each, and the build.
    timeout-minutes: 110
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install the pinned toolchain and a nightly one for libFuzzer
        run: |
          rustup toolchain install
          rustup toolchain install nightly --profile minimal

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      - name: Seed each corpus with the scripts and data files of the repository
        run: |
          mkdir -p fuzz/corpus/lexer fuzz/corpus/parser fuzz/corpus/checker fuzz/corpus/format fuzz/corpus/csv fuzz/corpus/distribution fuzz/corpus/formula
          for target in lexer parser checker format; do
            cp docs/spec/zeff_samples.zeff "fuzz/corpus/$target/"
            for script in samples/*/scripts/main.zeff samples/*/functions/*.zeff packages/*/*/functions/*.zeff; do
              cp "$script" "fuzz/corpus/$target/$(echo "$script" | tr '/' '_')"
            done
          done
          # A module and a script in one checker input, split by a NUL byte (the target's rule).
          for module in samples/user_functions/functions/*.zeff; do
            { cat "$module"; printf '\000'; cat samples/user_functions/scripts/main.zeff; } > "fuzz/corpus/checker/project_$(basename "$module")"
          done
          for file in tests/datasets/*.csv samples/data_cleaning/data/staff_de.csv samples/panel/data/*.csv tests/reference/data/event_panel.csv; do
            # Five option bytes (delimiter detected, quote `"`, decimal `.`, header, no declared
            # types) before the file.
            { printf '\000\001\000\000\000'; cat "$file"; } > "fuzz/corpus/csv/$(basename "$file")"
          done
          # Conversations with the language server on the sample scripts, in the target's two forms.
          python3 -I fuzz/lsp_seeds.py fuzz/corpus/lsp

      - name: Build the fuzz targets
        working-directory: fuzz
        # The runner's own target, named so that cargo-fuzz never picks a statically linked one.
        run: cargo +nightly fuzz build --target x86_64-unknown-linux-gnu

      - name: Fuzz the lexer, the parser, the checker, the formatter, the CSV reader, the distributions, the formulas and the language server for ten minutes each
        working-directory: fuzz
        run: |
          # The status of the fuzzer, not of `tail`: a crash or a timeout fails the job.
          set -o pipefail
          status=0
          for target in lexer parser checker format csv distribution formula lsp; do
            echo "::group::$target"
            # The language targets take the dictionary of the language's words, the language
            # server that of its protocol.
            dict=""
            case "$target" in
              lexer|parser|checker|format) dict="-dict=zeff.dict" ;;
              lsp) dict="-dict=lsp.dict" ;;
            esac
            if ! cargo +nightly fuzz run --target x86_64-unknown-linux-gnu "$target" -- -max_total_time=600 -timeout=20 $dict 2>&1 | tee "fuzz-$target.log" | tail -5; then
              status=1
            fi
            echo "::endgroup::"
          done
          exit $status

      - name: Write the note
        if: always()
        working-directory: fuzz
        run: |
          {
            echo "## Nightly: fuzzing"
            echo
            echo "Each target ran for ten minutes under libFuzzer (nightly toolchain, fuzz targets only); the lexer, parser, checker and formatter with the dictionary of the language's words, the checker also on module-and-script inputs and with the schemas of a project in hand, the formatter held to its two properties (formatting twice changes nothing; the formatted script parses to the same tree), the CSV reader with declared types, date patterns, naming rules and encodings, the language server on any bytes and on any bodies of messages, with the dictionary of its protocol (it must answer with messages of the protocol and never stop)."
            echo "A crash leaves its input under \`artifacts/<target>/\`; it becomes a regression test (testing handbook, section 1)."
            echo
            echo '```'
            for target in lexer parser checker format csv distribution formula lsp; do
              echo "$target: $(grep -E '^Done|^#[0-9]+ +DONE' "fuzz-$target.log" | tail -1)"
            done
            echo "crash inputs: $(find artifacts -type f 2>/dev/null | wc -l | tr -d ' ')"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the logs and any crash input
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-logs
          path: |
            fuzz/fuzz-*.log
            fuzz/artifacts
          if-no-files-found: ignore

  coverage:
    name: weekly (coverage)
    if: >-
      github.event_name == 'workflow_dispatch' && (inputs.job == 'both' || inputs.job == 'weekly' || inputs.job == 'coverage')
      || github.event.schedule == '41 3 * * 1'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install the pinned Rust toolchain with the LLVM tools
        run: |
          rustup toolchain install
          rustup component add llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Measure coverage
        run: |
          cargo llvm-cov --workspace --locked --json --output-path coverage.json
          cargo llvm-cov report --summary-only | tee coverage-summary.txt

      - name: The kernel and the estimators are covered to 80% or more (testing handbook, section 1)
        run: python3 -I tools/coverage/kernel_coverage.py coverage.json 80 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            coverage.json
            coverage-summary.txt

  mutation:
    # The estimator and variance code and the numeric kernel have far more mutants than one
    # runner tests in three hours (at 0.5.0: zeff-numeric 1,838, zeff-results 1,131, zeff-kernels
    # 364, zeff-regress 353, each running the workspace's tests, which take about seventy
    # seconds on a runner), so each crate's mutants are shared among runners in proportion,
    # about 115 a shard: a clean shard of 150 took two and three-quarter hours at 0.5.0.
    # From 0.7.0 the tests of `zeff-stats` are in the job too (3,633 mutants at step 39c): the
    # tests of means, counts and ranks, `anova` and `posthoc`.
    # From 0.8.0 (step 3) every shard runs in two passes. The first tests each mutant against its
    # own package's tests, which settle most mutants in seconds; the second (`--iterate`) retests
    # only the mutants the first left, missed or timed out, against the tests of the packages
    # that use the mutated one (`uses`), where a late test may catch what the package's own do
    # not; the conformance suite is among them for every package, since it alone pins the bits
    # of a result, and a mutant that moves a compensated sum by its last digits passes every
    # test that compares within a tolerance. At 0.7.0 one pass against the whole workspace, whose tests take over twenty minutes on
    # a runner, cut off 29 of 34 shards at the job's limit and listed a mutant that late tests
    # catch as timed out (docs/decisions.md, 14 November 2026, part seven).
    # From step 24a of 0.8.0 the mutants are dealt to the shards in turn (`--sharding
    # round-robin`), where the tool's default gives each shard a run of neighbours: the slow
    # mutants of one file (the studentized range, the signed-rank interval, the estimators) fell
    # to two or three shards, and eight of fifty were cut off at the limit in the run of 16
    # November 2026. The second pass has a memory limit of its own and proves its tests on the
    # unmutated code before it trusts them: in that run every mutant it tested was counted as
    # caught because the conformance tests ran out of memory under the limit of the first pass,
    # and the tool's own baseline, which runs the package's tests only, could not show it
    # (docs/decisions.md, 19 November 2026). A mutant that timed out in the first pass is a
    # hang or a slow failure under its own package's tests and is listed as that; it is not
    # tested again, where it would cost fifteen minutes to learn the same.
    name: weekly (mutation testing, ${{ matrix.package }} ${{ matrix.shard }} of ${{ matrix.of }})
    if: >-
      github.event_name == 'workflow_dispatch' && (inputs.job == 'both' || inputs.job == 'weekly')
      || github.event.schedule == '41 3 * * 1'
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      # Shards by hand: `shard` names them as `package k/n`, separated by commas, and the other
      # shards skip their steps.
      SELECTED: ${{ !inputs.shard || contains(format(',{0},', inputs.shard), format(',{0} {1}/{2},', matrix.package, matrix.shard, matrix.of)) }}
    strategy:
      fail-fast: false
      # Fourteen shards at once, so that six runners are left for the checks of a push: the run
      # of 19 November 2026 took all twenty for hours, and the checks of three commits waited
      # behind it (docs/decisions.md, 20 November 2026).
      max-parallel: 14
      matrix:
        include:
          - { package: zeff-numeric, shard: 0, of: 24, uses: "zeff-dist zeff-stats zeff-kernels zeff-conformance" }
          - { package: zeff-numeric, shard: 1, of: 24, uses: "zeff-dist zeff-stats zeff-kernels zeff-conformance" }
          - { package: zeff-numeric, shard: 2, of: 24, uses: "zeff-dist zeff-stats zeff-kernels zeff-conformance" }
          - { package: zeff-numeric, shard: 3, of: 24, uses: "zeff-dist zeff-stats zeff-kernels zeff-conformance" }
          - { package: zeff-numeric, shard: 4, of: 24, uses: "zeff-dist zeff-stats zeff-kernels zeff-conformance" }
          - { package: zeff-numeric, shard: 5, of: 24, uses: "zeff-dist zeff-stats zeff-kernels zeff-conformance" }
          - { package: zeff-numeric, shard: 6, of: 24, uses: "zeff-dist zeff-stats zeff-kernels zeff-conformance" }
          - { package: zeff-numeric, shard: 7, of: 24, uses: "zeff-dist zeff-stats zeff-kernels zeff-conformance" }
          - { package: zeff-numeric, shard: 8, of: 24, uses: "zeff-dist zeff-stats zeff-kernels zeff-conformance" }
          - { package: zeff-numeric, shard: 9, of: 24, uses: "zeff-dist zeff-stats zeff-kernels zeff-conformance" }
          - { package: zeff-numeric, shard: 10, of: 24, uses: "zeff-dist zeff-stats zeff-kernels zeff-conformance" }
          - { package: zeff-numeric, shard: 11, of: 24, uses: "zeff-dist zeff-stats zeff-kernels zeff-conformance" }
          - { package: zeff-numeric, shard: 12, of: 24, uses: "zeff-dist zeff-stats zeff-kernels zeff-conformance" }
          - { package: zeff-numeric, shard: 13, of: 24, uses: "zeff-dist zeff-stats zeff-kernels zeff-conformance" }
          - { package: zeff-numeric, shard: 14, of: 24, uses: "zeff-dist zeff-stats zeff-kernels zeff-conformance" }
          - { package: zeff-numeric, shard: 15, of: 24, uses: "zeff-dist zeff-stats zeff-kernels zeff-conformance" }
          - { package: zeff-numeric, shard: 16, of: 24, uses: "zeff-dist zeff-stats zeff-kernels zeff-conformance" }
          - { package: zeff-numeric, shard: 17, of: 24, uses: "zeff-dist zeff-stats zeff-kernels zeff-conformance" }
          - { package: zeff-numeric, shard: 18, of: 24, uses: "zeff-dist zeff-stats zeff-kernels zeff-conformance" }
          - { package: zeff-numeric, shard: 19, of: 24, uses: "zeff-dist zeff-stats zeff-kernels zeff-conformance" }
          - { package: zeff-numeric, shard: 20, of: 24, uses: "zeff-dist zeff-stats zeff-kernels zeff-conformance" }
          - { package: zeff-numeric, shard: 21, of: 24, uses: "zeff-dist zeff-stats zeff-kernels zeff-conformance" }
          - { package: zeff-numeric, shard: 22, of: 24, uses: "zeff-dist zeff-stats zeff-kernels zeff-conformance" }
          - { package: zeff-numeric, shard: 23, of: 24, uses: "zeff-dist zeff-stats zeff-kernels zeff-conformance" }
          - { package: zeff-kernels, shard: 0, of: 4, uses: "zeff-results zeff-regress zeff-stats zeff-conformance" }
          - { package: zeff-kernels, shard: 1, of: 4, uses: "zeff-results zeff-regress zeff-stats zeff-conformance" }
          - { package: zeff-kernels, shard: 2, of: 4, uses: "zeff-results zeff-regress zeff-stats zeff-conformance" }
          - { package: zeff-kernels, shard: 3, of: 4, uses: "zeff-results zeff-regress zeff-stats zeff-conformance" }
          - { package: zeff-results, shard: 0, of: 16, uses: "zeff-regress zeff-stats zeff-plot zeff-conformance" }
          - { package: zeff-results, shard: 1, of: 16, uses: "zeff-regress zeff-stats zeff-plot zeff-conformance" }
          - { package: zeff-results, shard: 2, of: 16, uses: "zeff-regress zeff-stats zeff-plot zeff-conformance" }
          - { package: zeff-results, shard: 3, of: 16, uses: "zeff-regress zeff-stats zeff-plot zeff-conformance" }
          - { package: zeff-results, shard: 4, of: 16, uses: "zeff-regress zeff-stats zeff-plot zeff-conformance" }
          - { package: zeff-results, shard: 5, of: 16, uses: "zeff-regress zeff-stats zeff-plot zeff-conformance" }
          - { package: zeff-results, shard: 6, of: 16, uses: "zeff-regress zeff-stats zeff-plot zeff-conformance" }
          - { package: zeff-results, shard: 7, of: 16, uses: "zeff-regress zeff-stats zeff-plot zeff-conformance" }
          - { package: zeff-results, shard: 8, of: 16, uses: "zeff-regress zeff-stats zeff-plot zeff-conformance" }
          - { package: zeff-results, shard: 9, of: 16, uses: "zeff-regress zeff-stats zeff-plot zeff-conformance" }
          - { package: zeff-results, shard: 10, of: 16, uses: "zeff-regress zeff-stats zeff-plot zeff-conformance" }
          - { package: zeff-results, shard: 11, of: 16, uses: "zeff-regress zeff-stats zeff-plot zeff-conformance" }
          - { package: zeff-results, shard: 12, of: 16, uses: "zeff-regress zeff-stats zeff-plot zeff-conformance" }
          - { package: zeff-results, shard: 13, of: 16, uses: "zeff-regress zeff-stats zeff-plot zeff-conformance" }
          - { package: zeff-results, shard: 14, of: 16, uses: "zeff-regress zeff-stats zeff-plot zeff-conformance" }
          - { package: zeff-results, shard: 15, of: 16, uses: "zeff-regress zeff-stats zeff-plot zeff-conformance" }
          - { package: zeff-regress, shard: 0, of: 16, uses: "zeff-conformance" }
          - { package: zeff-regress, shard: 1, of: 16, uses: "zeff-conformance" }
          - { package: zeff-regress, shard: 2, of: 16, uses: "zeff-conformance" }
          - { package: zeff-regress, shard: 3, of: 16, uses: "zeff-conformance" }
          - { package: zeff-regress, shard: 4, of: 16, uses: "zeff-conformance" }
          - { package: zeff-regress, shard: 5, of: 16, uses: "zeff-conformance" }
          - { package: zeff-regress, shard: 6, of: 16, uses: "zeff-conformance" }
          - { package: zeff-regress, shard: 7, of: 16, uses: "zeff-conformance" }
          - { package: zeff-regress, shard: 8, of: 16, uses: "zeff-conformance" }
          - { package: zeff-regress, shard: 9, of: 16, uses: "zeff-conformance" }
          - { package: zeff-regress, shard: 10, of: 16, uses: "zeff-conformance" }
          - { package: zeff-regress, shard: 11, of: 16, uses: "zeff-conformance" }
          - { package: zeff-regress, shard: 12, of: 16, uses: "zeff-conformance" }
          - { package: zeff-regress, shard: 13, of: 16, uses: "zeff-conformance" }
          - { package: zeff-regress, shard: 14, of: 16, uses: "zeff-conformance" }
          - { package: zeff-regress, shard: 15, of: 16, uses: "zeff-conformance" }
          - { package: zeff-stats, shard: 0, of: 24, uses: "zeff-plot zeff-conformance" }
          - { package: zeff-stats, shard: 1, of: 24, uses: "zeff-plot zeff-conformance" }
          - { package: zeff-stats, shard: 2, of: 24, uses: "zeff-plot zeff-conformance" }
          - { package: zeff-stats, shard: 3, of: 24, uses: "zeff-plot zeff-conformance" }
          - { package: zeff-stats, shard: 4, of: 24, uses: "zeff-plot zeff-conformance" }
          - { package: zeff-stats, shard: 5, of: 24, uses: "zeff-plot zeff-conformance" }
          - { package: zeff-stats, shard: 6, of: 24, uses: "zeff-plot zeff-conformance" }
          - { package: zeff-stats, shard: 7, of: 24, uses: "zeff-plot zeff-conformance" }
          - { package: zeff-stats, shard: 8, of: 24, uses: "zeff-plot zeff-conformance" }
          - { package: zeff-stats, shard: 9, of: 24, uses: "zeff-plot zeff-conformance" }
          - { package: zeff-stats, shard: 10, of: 24, uses: "zeff-plot zeff-conformance" }
          - { package: zeff-stats, shard: 11, of: 24, uses: "zeff-plot zeff-conformance" }
          - { package: zeff-stats, shard: 12, of: 24, uses: "zeff-plot zeff-conformance" }
          - { package: zeff-stats, shard: 13, of: 24, uses: "zeff-plot zeff-conformance" }
          - { package: zeff-stats, shard: 14, of: 24, uses: "zeff-plot zeff-conformance" }
          - { package: zeff-stats, shard: 15, of: 24, uses: "zeff-plot zeff-conformance" }
          - { package: zeff-stats, shard: 16, of: 24, uses: "zeff-plot zeff-conformance" }
          - { package: zeff-stats, shard: 17, of: 24, uses: "zeff-plot zeff-conformance" }
          - { package: zeff-stats, shard: 18, of: 24, uses: "zeff-plot zeff-conformance" }
          - { package: zeff-stats, shard: 19, of: 24, uses: "zeff-plot zeff-conformance" }
          - { package: zeff-stats, shard: 20, of: 24, uses: "zeff-plot zeff-conformance" }
          - { package: zeff-stats, shard: 21, of: 24, uses: "zeff-plot zeff-conformance" }
          - { package: zeff-stats, shard: 22, of: 24, uses: "zeff-plot zeff-conformance" }
          - { package: zeff-stats, shard: 23, of: 24, uses: "zeff-plot zeff-conformance" }
    steps:
      - name: Check out the repository
        if: env.SELECTED == 'true'
        uses: actions/checkout@v4

      - name: Install the pinned Rust toolchain
        if: env.SELECTED == 'true'
        run: rustup toolchain install

      - name: Install cargo-mutants
        if: env.SELECTED == 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants

      - name: Mutation testing of ${{ matrix.package }}, shard ${{ matrix.shard }} of ${{ matrix.of }}
        if: env.SELECTED == 'true'
        env:
          # A mutant that allocates without bound exhausted the runner's memory three times in
          # the first run of 0.4.0, and the service shut the runner down before any timeout.
          # Every test process therefore runs under a limit of 2 GB on the memory it may
          # allocate (`prlimit`, which Cargo applies through its runner setting and the processes
          # a test spawns inherit), so that such a mutant aborts in its test and is caught while
          # the handful of test processes that run at once stay within the runner's memory. The
          # whole suite's largest process needs a sixth of a gigabyte.
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: prlimit --data=2147483648
          # Three shard runners of 0.5.0 filled their disks within minutes of starting (every
          # mutant's build then fails with "No space left on device" and is counted unviable):
          # the workspace's test build with full debug information is several gigabytes, and
          # some runner images have little more than that free. The build carries no debug
          # information here; a mutant's verdict is the test's pass or fail, not a backtrace.
          CARGO_PROFILE_DEV_DEBUG: 0
          # The property tests draw their cases from one fixed seed here. With a fresh seed for
          # every mutant, a property that fails by chance on correct code leaves its failing
          # case beside the test in the shard's working copy, where it is replayed against
          # every later mutant, and each of those is counted as caught whether or not a test
          # catches it: at 0.6.0 two panels of the event-study generator did so in seven shards
          # and decided 63 mutants (found at step 24b, the generator corrected). With one seed the
          # unmutated baseline and every mutant see the same cases, so a failure under a mutant
          # is the mutant's own.
          PROPTEST_RNG_SEED: "20261105"
        run: |
          # Surviving mutants and timeouts are a note to act on, not a failure of the job. Two
          # tests of the dist package make over a million calls into the kernel (the moments of
          # 100,000 draws per distribution; R's grid of every family) and under a mutant that
          # stops a series converging they run for hours before failing, where the kernel's own
          # exact reference rejects the mutant in seconds; they are skipped here and run in CI
          # on every push. cargo-mutants takes its budget from a baseline of the package's own
          # tests, which run in seconds, so the floor is the whole budget of each pass.
          # Pass one: the package's own tests, with a floor of two minutes, which covers a slow
          # failure under them and is what a hang by nature costs.
          (cargo mutants --package ${{ matrix.package }} --shard ${{ matrix.shard }}/${{ matrix.of }} --sharding round-robin --test-workspace false --timeout-multiplier 5 --minimum-test-timeout 120 --output mutants -- -- --skip draws_recover_their_distribution --skip every_family_agrees_with_r_at_six_digits || true) 2>&1 | tail -40
          mkdir -p pass1 && cp mutants/mutants.out/*.txt pass1/ || true
          echo "Pass one, against the package's own tests: caught $(wc -l < pass1/caught.txt | tr -d ' '), missed $(wc -l < pass1/missed.txt | tr -d ' '), timed out $(wc -l < pass1/timeout.txt | tr -d ' '), unviable $(wc -l < pass1/unviable.txt | tr -d ' ')"
          # Pass two: what pass one missed, against the tests of the packages that use this one,
          # with a floor of fifteen minutes. Those tests take about ten minutes on the unmutated
          # code where the plot package is among them (586 seconds in the run of 20 November
          # 2026, 44653636848, 489 the day before), and cargo stops at the first test program
          # that fails: under the floor of ten minutes that stood until then, a mutant caught
          # by one of the last programs was cut off before that program ran and reported as a
          # timeout, and so was every mutant that no test catches. `--iterate` skips the mutants a previous run caught, but it cuts its shards
          # afresh from what is left of the whole package, so a second run with `--shard` tests
          # other shards' mutants (the run of 15 November 2026 by hand, 43675253535, tested 106
          # where 14 were left). So the second pass takes no shard: every mutant of the package
          # that is not one of this shard's leftovers is written down as settled, and the tool
          # is left with exactly the leftovers.
          cargo mutants --list --package ${{ matrix.package }} | sort > all.txt
          sort pass1/missed.txt > left.txt
          comm -23 all.txt left.txt > mutants/mutants.out/caught.txt
          echo "Pass two retests $(wc -l < left.txt | tr -d ' ') mutants of $(wc -l < all.txt | tr -d ' ') in the package"
          TEST_PACKAGES=""
          for p in ${{ matrix.uses }}; do TEST_PACKAGES="$TEST_PACKAGES --test-package $p"; done
          # The tests of pass two, as the test programs are given them. Three tests of the
          # conformance package are left out: two that build the whole report again beside the
          # test that compares it with the committed one, and the test of the formatter, which
          # no mutant of these packages reaches. The report, the sample projects, the help
          # pages' examples and the regressions stay.
          SKIPS="--skip draws_recover_their_distribution --skip every_family_agrees_with_r_at_six_digits --skip the_report_is_the_same_twice --skip every_case_has_its_own_name --skip every_script_of_the_suite_is_formatted_and_stays_so"
          MEMORY_CAUGHT=0
          if [ -s left.txt ]; then
            # The conformance suite asks for two thirds of a gigabyte in one piece, and several
            # of its tests run at once, so the 2 GB of the first pass is too little for it: 6 GB
            # here, on a runner of 16 GB that tests one mutant at a time.
            export CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER="prlimit --data=6442450944"
            # The guard: these same tests, under this same limit, on the unmutated code. The
            # tool's baseline runs the mutated package's tests only, so without this a test that
            # fails here for a reason of its own (too little memory, a file the copy lacks)
            # would count every mutant as caught. If they do not pass, the job fails.
            GUARD_PACKAGES=""
            for p in ${{ matrix.uses }}; do GUARD_PACKAGES="$GUARD_PACKAGES --package $p"; done
            if ! cargo test --locked $GUARD_PACKAGES -- $SKIPS > guard.log 2>&1; then
              tail -60 guard.log
              echo "::error::The tests of pass two do not pass on the unmutated code under this job's limits, so no verdict of pass two could be trusted. Nothing was retested."
              exit 1
            fi
            echo "The guard: $(grep -c '^test result: ok' guard.log) test programs of pass two pass on the unmutated code under its limit"
            cargo clean
            (cargo mutants --package ${{ matrix.package }} --iterate $TEST_PACKAGES --timeout-multiplier 5 --minimum-test-timeout 900 --output mutants -- -- $SKIPS || true) 2>&1 | tail -40
            # A mutant that asks for memory without bound is caught by the limit, and rightly;
            # but if most of the mutants of pass two end so, the limit is catching the tests and
            # not the mutants. The count is printed for the reader of the note.
            MEMORY_CAUGHT=$( (grep -l "memory allocation of" mutants/mutants.out/log/*.log 2>/dev/null || true) | wc -l | tr -d ' ')
          else
            : > mutants/mutants.out/missed.txt; : > mutants/mutants.out/timeout.txt
          fi
          cat pass1/timeout.txt mutants/mutants.out/timeout.txt 2>/dev/null | sort > timeouts.txt || true
          # The tool's own output is cut to its last forty lines, which holds the totals and at
          # most nineteen survivors. The lists are printed here in full, so that a shard with
          # more can be read from its log (at 0.7.0 three shards of zeff-stats had more).
          echo "Surviving mutants after both passes, in full:"
          cat mutants/mutants.out/missed.txt || true
          echo "Timeouts (those of pass one, which are not retested, and those of pass two), in full:"
          cat timeouts.txt || true
          echo "Mutants of pass two that ended by running out of memory: $MEMORY_CAUGHT"
          # The survivors and timeouts against the recorded ones: what is new is what the
          # reader of the note has to act on (docs/decisions.md, 20 November 2026).
          python3 -I tools/mutants/compare.py --part tools/mutants/recorded.txt mutants/mutants.out/missed.txt timeouts.txt | tee compare.txt
          {
            echo "## Weekly: mutation testing of ${{ matrix.package }}, shard ${{ matrix.shard }} of ${{ matrix.of }}"
            echo
            echo "Pass one (the package's own tests): caught $(wc -l < pass1/caught.txt | tr -d ' '), missed $(wc -l < pass1/missed.txt | tr -d ' '), timed out $(wc -l < pass1/timeout.txt | tr -d ' '), unviable $(wc -l < pass1/unviable.txt | tr -d ' ')"
            echo
            echo "After pass two (what pass one missed, against the tests of ${{ matrix.uses }}):"
            echo
            echo "Retested: $(wc -l < left.txt | tr -d ' ')"
            echo "Missed (surviving mutants, each a test to write): $(wc -l < mutants/mutants.out/missed.txt | tr -d ' ')"
            echo "Timed out in pass two: $(wc -l < mutants/mutants.out/timeout.txt | tr -d ' ')"
            echo "Ended by running out of memory in pass two: $MEMORY_CAUGHT"
            echo
            echo '```'
            cat mutants/mutants.out/missed.txt
            echo '```'
            echo
            echo "Against the recorded survivors (tools/mutants/recorded.txt):"
            echo
            echo '```'
            cat compare.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the reports
        if: always() && env.SELECTED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mutation-reports-${{ matrix.package }}-${{ matrix.shard }}
          path: |
            mutants/mutants.out
            pass1
            left.txt
            timeouts.txt
            compare.txt
            guard.log
