name: Scheduled

# The nightly and weekly jobs of the testing handbook, sections 2.2, 2.3 and 6: the long property
# runs, the stochastic class, the truth-recovery Monte Carlo, the benchmark suite and the fuzzing
# every night, coverage and mutation testing every week. All can also be
# started by hand from the Actions page. Results go to each run's summary page and its artifacts.
on:
  schedule:
    - cron: "17 2 * * *"   # nightly, 02:17 UTC
    - cron: "41 3 * * 1"   # weekly, Mondays 03:41 UTC
  workflow_dispatch:
    inputs:
      job:
        description: "Which job to run"
        type: choice
        options: [both, nightly, fuzz, weekly, coverage, bench]
        default: both
      shard:
        description: "Run only these mutation shards of the weekly job, each written as `package k/n`, separated by commas without spaces"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  nightly:
    name: nightly (long property runs)
    if: >-
      github.event_name == 'workflow_dispatch' && (inputs.job == 'both' || inputs.job == 'nightly')
      || github.event.schedule == '17 2 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - name: Run every test with every property run 25 times longer, in release mode
        env:
          ZEFF_PROPERTY_MULTIPLIER: "25"
        run: cargo test --workspace --locked --release 2>&1 | tee nightly.log

      - name: Run the stochastic class, 50 seeds of 100,000 draws for each distribution
        run: cargo test -p zeff-dist --locked --release --test nightly_stochastic -- --ignored --nocapture 2>&1 | tee stochastic.log

      - name: Run the truth-recovery Monte Carlo, 50 seeds under three designs
        run: cargo test -p zeff-regress --locked --release --test nightly_truth -- --ignored --nocapture 2>&1 | tee truth.log

      - name: Run the benchmark suite (import, summary and mean by group, reg; 10⁴, 10⁶ and 10⁷ rows)
        run: cargo bench -p zeff-bench --locked --bench suite 2>&1 | tee bench-suite.log

      - name: Write the note
        if: always()
        run: |
          {
            echo "## Nightly: long property runs"
            echo
            echo "Every property test ran 25 times its usual number of cases, in release mode."
            echo
            echo '```'
            grep -E "^test result|^test .*FAILED|minimal failing" nightly.log || true
            echo '```'
            echo
            echo "## Nightly: the stochastic class"
            echo
            echo "Each of the 14 distributions was drawn 100,000 times under each of 50 seeds and compared with its exact mean, variance and distribution function (mean within 5 standard errors, no lean over the seeds, Kolmogorov–Smirnov distance below 2.6/sqrt(n))."
            echo
            echo '```'
            cat stochastic.log || true
            echo '```'
            echo
            echo "## Nightly: truth recovery"
            echo
            echo "Fifty seeds of 400 rows were drawn with the engine's generator under three designs with known coefficients (homoskedastic, heteroskedastic and clustered errors) and fitted by \`reg\` with classical, HC1 to HC3 and CR1 errors. Each coefficient's bias is within four standard errors of its Monte Carlo mean, and the 95 per cent intervals of the standard errors that suit each design cover between 89 and 99.5 per cent of the time (testing handbook, section 1)."
            echo
            echo '```'
            grep -vE "^(running|test |$)" truth.log || true
            echo '```'
            echo
            echo "## Nightly: the benchmark suite"
            echo
            echo "Processor: $(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2- | sed 's/^ //')"
            echo
            echo "The suite of the testing handbook, section 6: \`import\` of a CSV, \`summary\` and \`mean\` by a group, and \`reg\` without fixed effects, at ten thousand, a million and ten million rows of generated data, each result checked against its stored digest before it is timed. The times are recorded in the release notes; a slow-down is a note to act on, not a failure of the job (open decision #52)."
            echo
            echo '```'
            grep -B1 "time:" bench-suite.log | grep -v "^--$" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-log
          path: |
            nightly.log
            stochastic.log
            truth.log
            bench-suite.log
          if-no-files-found: ignore

  bench:
    # The micro-benchmark of open decision #47 on the x86-64 runner: the reduction shape of
    # zeff-kernels against the scalar sum of zeff-numeric. Started by hand only; its figures go to
    # the run's summary page and are recorded in docs/decisions.md.
    name: benchmark (the reduction shape, x86-64)
    if: github.event_name == 'workflow_dispatch' && inputs.job == 'bench'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - name: Run the micro-benchmark of the reductions
        run: cargo bench -p zeff-kernels --locked --bench reduction 2>&1 | tee bench.log

      - name: Write the note
        if: always()
        run: |
          {
            echo "## Benchmark: the reduction shape of open decision #47"
            echo
            echo "Processor: $(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2- | sed 's/^ //')"
            echo
            echo '```'
            grep -B1 "time:" bench.log | grep -v "^--$" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-log
          path: bench.log
          if-no-files-found: ignore

  fuzz:
    name: nightly (fuzzing)
    if: >-
      github.event_name == 'workflow_dispatch' && (inputs.job == 'both' || inputs.job == 'fuzz')
      || github.event.schedule == '17 2 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install the pinned toolchain and a nightly one for libFuzzer
        run: |
          rustup toolchain install
          rustup toolchain install nightly --profile minimal

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      - name: Seed each corpus with the scripts and data files of the repository
        run: |
          mkdir -p fuzz/corpus/lexer fuzz/corpus/parser fuzz/corpus/checker fuzz/corpus/csv fuzz/corpus/distribution fuzz/corpus/formula
          for target in lexer parser checker; do
            cp docs/spec/zeff_samples.zeff "fuzz/corpus/$target/"
            for script in samples/*/scripts/main.zeff samples/*/functions/*.zeff packages/*/*/functions/*.zeff; do
              cp "$script" "fuzz/corpus/$target/$(echo "$script" | tr '/' '_')"
            done
          done
          # A module and a script in one checker input, split by a NUL byte (the target's rule).
          for module in samples/user_functions/functions/*.zeff; do
            { cat "$module"; printf '\000'; cat samples/user_functions/scripts/main.zeff; } > "fuzz/corpus/checker/project_$(basename "$module")"
          done
          for file in tests/datasets/*.csv samples/data_cleaning/data/staff_de.csv; do
            # Four option bytes (delimiter detected, quote `"`, decimal `.`, header) before the file.
            { printf '\000\001\000\000'; cat "$file"; } > "fuzz/corpus/csv/$(basename "$file")"
          done

      - name: Build the fuzz targets
        working-directory: fuzz
        # The runner's own target, named so that cargo-fuzz never picks a statically linked one.
        run: cargo +nightly fuzz build --target x86_64-unknown-linux-gnu

      - name: Fuzz the lexer, the parser, the checker, the CSV reader, the distributions and the formulas for ten minutes each
        working-directory: fuzz
        run: |
          # The status of the fuzzer, not of `tail`: a crash or a timeout fails the job.
          set -o pipefail
          status=0
          for target in lexer parser checker csv distribution formula; do
            echo "::group::$target"
            # The language targets take the dictionary of the language's words.
            dict=""
            case "$target" in lexer|parser|checker) dict="-dict=zeff.dict" ;; esac
            if ! cargo +nightly fuzz run --target x86_64-unknown-linux-gnu "$target" -- -max_total_time=600 -timeout=20 $dict 2>&1 | tee "fuzz-$target.log" | tail -5; then
              status=1
            fi
            echo "::endgroup::"
          done
          exit $status

      - name: Write the note
        if: always()
        working-directory: fuzz
        run: |
          {
            echo "## Nightly: fuzzing"
            echo
            echo "Each target ran for ten minutes under libFuzzer (nightly toolchain, fuzz targets only); the lexer, parser and checker with the dictionary of the language's words, the checker also on module-and-script inputs."
            echo "A crash leaves its input under \`artifacts/<target>/\`; it becomes a regression test (testing handbook, section 1)."
            echo
            echo '```'
            for target in lexer parser checker csv distribution formula; do
              echo "$target: $(grep -E '^Done|^#[0-9]+ +DONE' "fuzz-$target.log" | tail -1)"
            done
            echo "crash inputs: $(find artifacts -type f 2>/dev/null | wc -l | tr -d ' ')"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the logs and any crash input
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-logs
          path: |
            fuzz/fuzz-*.log
            fuzz/artifacts
          if-no-files-found: ignore

  coverage:
    name: weekly (coverage)
    if: >-
      github.event_name == 'workflow_dispatch' && (inputs.job == 'both' || inputs.job == 'weekly' || inputs.job == 'coverage')
      || github.event.schedule == '41 3 * * 1'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install the pinned Rust toolchain with the LLVM tools
        run: |
          rustup toolchain install
          rustup component add llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Measure coverage
        run: |
          cargo llvm-cov --workspace --locked --json --output-path coverage.json
          cargo llvm-cov report --summary-only | tee coverage-summary.txt

      - name: The kernel and the estimators are covered to 80% or more (testing handbook, section 1)
        run: python3 -I tools/coverage/kernel_coverage.py coverage.json 80 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            coverage.json
            coverage-summary.txt

  mutation:
    # The estimator and variance code and the numeric kernel have far more mutants than one
    # runner tests in three hours (at 0.4.0: zeff-numeric 1,838, zeff-results 1,043, zeff-kernels
    # 368, zeff-regress 288, each running the workspace's tests), so each crate's mutants are
    # shared among runners in proportion, about 150 a shard.
    name: weekly (mutation testing, ${{ matrix.package }} ${{ matrix.shard }} of ${{ matrix.of }})
    if: >-
      github.event_name == 'workflow_dispatch' && (inputs.job == 'both' || inputs.job == 'weekly')
      || github.event.schedule == '41 3 * * 1'
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      # Shards by hand: `shard` names them as `package k/n`, separated by commas, and the other
      # shards skip their steps.
      SELECTED: ${{ !inputs.shard || contains(format(',{0},', inputs.shard), format(',{0} {1}/{2},', matrix.package, matrix.shard, matrix.of)) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { package: zeff-numeric, shard: 0, of: 12 }
          - { package: zeff-numeric, shard: 1, of: 12 }
          - { package: zeff-numeric, shard: 2, of: 12 }
          - { package: zeff-numeric, shard: 3, of: 12 }
          - { package: zeff-numeric, shard: 4, of: 12 }
          - { package: zeff-numeric, shard: 5, of: 12 }
          - { package: zeff-numeric, shard: 6, of: 12 }
          - { package: zeff-numeric, shard: 7, of: 12 }
          - { package: zeff-numeric, shard: 8, of: 12 }
          - { package: zeff-numeric, shard: 9, of: 12 }
          - { package: zeff-numeric, shard: 10, of: 12 }
          - { package: zeff-numeric, shard: 11, of: 12 }
          - { package: zeff-kernels, shard: 0, of: 3 }
          - { package: zeff-kernels, shard: 1, of: 3 }
          - { package: zeff-kernels, shard: 2, of: 3 }
          - { package: zeff-results, shard: 0, of: 7 }
          - { package: zeff-results, shard: 1, of: 7 }
          - { package: zeff-results, shard: 2, of: 7 }
          - { package: zeff-results, shard: 3, of: 7 }
          - { package: zeff-results, shard: 4, of: 7 }
          - { package: zeff-results, shard: 5, of: 7 }
          - { package: zeff-results, shard: 6, of: 7 }
          - { package: zeff-regress, shard: 0, of: 2 }
          - { package: zeff-regress, shard: 1, of: 2 }
    steps:
      - name: Check out the repository
        if: env.SELECTED == 'true'
        uses: actions/checkout@v4

      - name: Install the pinned Rust toolchain
        if: env.SELECTED == 'true'
        run: rustup toolchain install

      - name: Install cargo-mutants
        if: env.SELECTED == 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants

      - name: Mutation testing of ${{ matrix.package }}, shard ${{ matrix.shard }} of ${{ matrix.of }}
        if: env.SELECTED == 'true'
        env:
          # A mutant that allocates without bound exhausted the runner's memory three times in
          # the first run of 0.4.0, and the service shut the runner down before any timeout.
          # Every test process therefore runs under a limit of 2 GB on the memory it may
          # allocate (`prlimit`, which Cargo applies through its runner setting and the processes
          # a test spawns inherit), so that such a mutant aborts in its test and is caught while
          # the handful of test processes that run at once stay within the runner's memory. The
          # whole suite's largest process needs a sixth of a gigabyte.
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: prlimit --data=2147483648
        run: |
          # Surviving mutants and timeouts are a note to act on, not a failure of the job. Two
          # tests of the dist package make over a million calls into the kernel (the moments of
          # 100,000 draws per distribution; R's grid of every family) and under a mutant that
          # stops a series converging they run for hours before failing, where the kernel's own
          # exact reference rejects the mutant in seconds; they are skipped here and run in CI
          # on every push.
          (cargo mutants --package ${{ matrix.package }} --shard ${{ matrix.shard }}/${{ matrix.of }} --test-workspace true --timeout-multiplier 5 --minimum-test-timeout 120 --output mutants -- -- --skip draws_recover_their_distribution --skip every_family_agrees_with_r_at_six_digits || true) 2>&1 | tail -40
          {
            echo "## Weekly: mutation testing of ${{ matrix.package }}, shard ${{ matrix.shard }} of ${{ matrix.of }}"
            echo
            echo "Caught: $(wc -l < mutants/mutants.out/caught.txt | tr -d ' ')"
            echo "Missed (surviving mutants, each a test to write): $(wc -l < mutants/mutants.out/missed.txt | tr -d ' ')"
            echo "Timed out: $(wc -l < mutants/mutants.out/timeout.txt | tr -d ' ')"
            echo "Unviable: $(wc -l < mutants/mutants.out/unviable.txt | tr -d ' ')"
            echo
            echo '```'
            cat mutants/mutants.out/missed.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the reports
        if: always() && env.SELECTED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mutation-reports-${{ matrix.package }}-${{ matrix.shard }}
          path: mutants/mutants.out
