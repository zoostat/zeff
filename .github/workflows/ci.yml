name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  words:
    name: words
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository with its full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refuse forbidden words in names, contents and history
        env:
          FORBIDDEN_WORDS: ${{ vars.FORBIDDEN_WORDS }}
        run: |
          if [ -z "${FORBIDDEN_WORDS}" ]; then
            echo "The repository variable FORBIDDEN_WORDS is empty or missing."
            exit 1
          fi
          failed=0

          echo "1. Tracked file and folder names"
          if git ls-files | grep -i -E -e "${FORBIDDEN_WORDS}"; then
            echo "A tracked file name contains a forbidden word (matching lines above)."
            failed=1
          fi

          echo "2. Contents of tracked text files"
          if git grep -i -I -n -E -e "${FORBIDDEN_WORDS}"; then
            echo "A tracked file contains a forbidden word (file:line:text above)."
            failed=1
          fi

          echo "3. Commit messages, author and committer names and emails, all branches and tags"
          hits=$(git log --all --format='%H' | while read -r sha; do
            git log -1 --format='%B%n%an%n%ae%n%cn%n%ce' "$sha" \
              | grep -i -E -e "${FORBIDDEN_WORDS}" \
              | sed "s/^/commit ${sha}: /" || true
          done)
          if [ -n "${hits}" ]; then
            echo "${hits}"
            echo "The history contains a forbidden word (commit and matching line above)."
            failed=1
          fi

          if [ "${failed}" -ne 0 ]; then
            exit 1
          fi
          echo "No forbidden word found."

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - name: Build the workspace
        run: cargo build --workspace --locked

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy with warnings denied
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - name: Run every test
        run: cargo test --workspace --locked

      - name: The parser's stack at the deepest nesting stays within its budget (section 3.8)
        run: cargo test --release --locked -p zeff-syntax --test stack_limits

  tiers:
    name: tiers
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - name: Core depends only on kernel crates, and every call goes down (section 8.1)
        run: cargo run --locked -p xtask -- check-tiers

      - name: Every diagnostic code has a snapshot of its wording (section 11)
        run: cargo run --locked -p xtask -- check-messages

  identity:
    name: identity (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86-64
            runner: ubuntu-latest
            rustflags: ""
          - name: linux-x86-64-v3
            runner: ubuntu-latest
            rustflags: "-C target-cpu=x86-64-v3"
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            rustflags: ""
          - name: macos-arm64
            runner: macos-latest
            rustflags: ""
    runs-on: ${{ matrix.runner }}
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - name: Show the processor (the x86-64 levels are told apart by these flags)
        run: |
          if [ "$(uname -s)" = "Linux" ]; then
            grep -m1 'model name' /proc/cpuinfo || true
            grep -m1 -E '^(flags|Features)' /proc/cpuinfo | tr ' ' '\n' | grep -E '^(sse2|avx|avx2|avx512f|fma|asimd|neon)$' | sort -u | tr '\n' ' ' || true
            echo
          else
            sysctl -n machdep.cpu.brand_string
          fi

      - name: Run the conformance cases of a release build
        run: |
          cargo build --release --locked -p zeff-conformance
          mkdir -p report
          ./target/release/zeff-conformance > report/cases.txt
          cat report/cases.txt

      - name: Keep the report for the comparison
        uses: actions/upload-artifact@v4
        with:
          name: identity-${{ matrix.name }}
          path: report/cases.txt

  identity-wasm:
    name: identity (wasm)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - name: Restore the WebAssembly binding tool
        id: tool
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-0.2.129-${{ runner.os }}

      - name: Install the WebAssembly binding tool at the pinned version
        if: steps.tool.outputs.cache-hit != 'true'
        run: cargo install wasm-bindgen-cli --version '=0.2.129' --locked

      - name: Build for WebAssembly with SIMD128
        env:
          RUSTFLAGS: -C target-feature=+simd128 -C link-arg=-zstack-size=8388608
        run: |
          cargo build --release --locked -p zeff-conformance --target wasm32-unknown-unknown
          wasm-bindgen --target nodejs --out-dir wasm-pkg target/wasm32-unknown-unknown/release/zeff_conformance.wasm

      - name: Run the conformance cases under Node
        run: |
          node --version
          node crates/zeff-conformance/wasm/run.cjs wasm-pkg report/cases.txt
          cat report/cases.txt

      - name: Keep the report for the comparison
        uses: actions/upload-artifact@v4
        with:
          name: identity-wasm
          path: report/cases.txt

      - name: Test the measuring script
        run: node --test tools/bundle/measure.test.cjs

      - name: Measure the compressed bundle and the cold start (risks R2 and R4)
        run: node tools/bundle/measure.cjs wasm-pkg zeff_conformance bundle/bundle.json

      - name: Keep the measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bundle-wasm
          path: bundle/bundle.json

  identity-compare:
    name: identity (compare)
    needs: [identity, identity-wasm]
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - name: Collect the reports
        uses: actions/download-artifact@v4
        with:
          pattern: identity-*
          path: reports

      - name: Add the committed report
        run: cp crates/zeff-conformance/expected.txt reports/expected.txt

      - name: Every target gives the committed report, bit for bit
        run: cargo run --locked -p xtask -- compare-identity reports 6

  reference:
    name: reference
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install the Python the references were made with
        uses: actions/setup-python@v5
        with:
          python-version-file: tests/reference/.python-version

      - name: Rebuild the references and the datasets with the standard library's exact arithmetic
        run: |
          python3 --version
          python3 -I tests/reference/descriptive.py
          python3 -I tests/reference/functions.py
          python3 -I tests/reference/csv_cases.py
          python3 -I tests/reference/maths.py
          python3 -I tests/reference/special.py

      - name: Install the R the references were made with (tests/reference/r/renv.lock)
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.0'
          use-public-rspm: true

      - name: Rebuild the shipped datasets from their generating scripts
        run: |
          python3 -I packages/tier1/datasets/generate/wages.py
          python3 -I packages/tier1/datasets/generate/sleep.py
          cargo run -q -p xtask -- build-datasets

      - name: Rebuild the R references
        run: |
          Rscript --version
          Rscript tests/reference/r/maths.R
          Rscript tests/reference/r/special.R
          Rscript tests/reference/r/descriptive.R
          Rscript tests/reference/r/frames.R

      - name: R's values agree with the committed copies within tolerance
        # R uses the platform's maths library and, on x86, extended precision for means, so its
        # last bits differ between Linux and macOS; the committed copies are compared within
        # tolerance (tests/reference/r/check_r.py) and the differences are printed.
        run: |
          for name in maths descriptive special; do
            git show HEAD:tests/reference/r/$name.json > /tmp/committed_r_$name.json
            git diff --stat -- tests/reference/r/$name.json
            python3 -I tests/reference/r/check_r.py $name /tmp/committed_r_$name.json tests/reference/r/$name.json
            git checkout -- tests/reference/r/$name.json
          done

      - name: The committed references and datasets are what the scripts write
        run: git diff --exit-code --stat -- tests/ packages/tier1/datasets/data/
