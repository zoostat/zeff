name: A wrong result
description: Zeff printed a number, a table or a plot that you believe is wrong, without an error.
title: "Wrong result: "
body:
  - type: markdown
    attributes:
      value: |
        A wrong result is the most serious kind of fault, and it is corrected first. To act on it we need the result it should have been, from another program or from a computation by hand.

        `zeff report-bug --line <n> --reference <file>` writes most of this report for you: `<n>` is a line of the statement whose result is wrong, and `<file>` is a text file holding the result it should give. The report is written into `.zeff/reports/` of your project. Read it, then paste it below. It holds no rows of your data.
  - type: textarea
    id: statements
    attributes:
      label: The statements
      description: The statement whose result is wrong and the statements it needs, as few as show the fault. The section "The statements" of the report holds them.
      render: text
    validations:
      required: true
  - type: textarea
    id: printed
    attributes:
      label: What Zeff printed
      render: text
    validations:
      required: true
  - type: textarea
    id: reference
    attributes:
      label: The reference result
      description: What the result should be, and where it comes from. Paste the command you ran in R, Stata or another program with what it printed, or write out the computation by hand. A report without a reference cannot be acted on.
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version and platform
      description: What `zeff version -v` prints, or the section "Zeff" of the report.
      placeholder: "zeff 0.8.0, aarch64 macos"
    validations:
      required: true
  - type: textarea
    id: data
    attributes:
      label: The data
      description: Which data the statements read. A dataset shipped with Zeff needs only its name. For your own data, the section "The data" of the report gives the names and types of the variables; attach the rows only if you may share them. The reference was computed on every row, so the rows are not shrunk for this kind of report.
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: The report of `zeff report-bug`
      description: The whole file, if you have it. Read it before you paste it.
      render: markdown
    validations:
      required: false
