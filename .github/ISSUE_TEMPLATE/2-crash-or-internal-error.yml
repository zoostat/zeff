name: A crash or an internal error
description: Zeff stopped with an internal error (a code that begins Z9), closed without a message, or did not come back.
title: "Internal error: "
body:
  - type: markdown
    attributes:
      value: |
        An internal error is a fault in Zeff, not in your script.

        `zeff report-bug` writes this report for you. It runs the script again, keeps the failing statement and the statements it depends on, and writes a file into `.zeff/reports/` of your project. Read it, then paste it below. It holds no rows of your data. With `--synthetic` it also writes the few rows the failure needs beside it, with made-up values wherever the failure still occurs.
  - type: textarea
    id: message
    attributes:
      label: What Zeff said
      description: The error as it was printed, whole. If Zeff closed or did not come back, say what you saw and after how long.
      render: text
    validations:
      required: true
  - type: textarea
    id: statements
    attributes:
      label: The statements
      description: The failing statement and the statements it needs. The section "The statements" of the report holds them.
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version and platform
      description: What `zeff version -v` prints, or the section "Zeff" of the report.
      placeholder: "zeff 0.8.0, aarch64 macos"
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: The report of `zeff report-bug`
      description: The whole file. Read it before you paste it. If you ran it with `--include-data` or `--synthetic`, read the files it wrote beside the report too, and attach them only if you may share them.
      render: markdown
    validations:
      required: false
  - type: dropdown
    id: again
    attributes:
      label: Does it happen every time?
      options:
        - Every time I run the script
        - Only sometimes
        - It happened once
    validations:
      required: true
