# The fuzz targets of the testing handbook, section 1 (Language Reference, section 11: random
# programs fed to the parser and checker must answer with a diagnostic, never a crash). Built
# only by `cargo +nightly fuzz` in the nightly job; a separate package outside the workspace so
# the engine's toolchain stays pinned stable.
[package]
name = "zeff-fuzz"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.13"
zeff-syntax = { path = "../crates/zeff-syntax" }
zeff-ir = { path = "../crates/zeff-ir" }
zeff-registry = { path = "../kernel/zeff-registry" }
zeff-engine = { path = "../crates/zeff-engine" }
zeff-data = { path = "../packages/tier1/data" }

[[bin]]
name = "lexer"
path = "fuzz_targets/lexer.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parser"
path = "fuzz_targets/parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "checker"
path = "fuzz_targets/checker.rs"
test = false
doc = false
bench = false

[[bin]]
name = "csv"
path = "fuzz_targets/csv.rs"
test = false
doc = false
bench = false

[[bin]]
name = "distribution"
path = "fuzz_targets/distribution.rs"
test = false
doc = false
bench = false

[workspace]
